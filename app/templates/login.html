{% extends "lab_base.html" %}
{% block content %}
<h1>Login</h1>
<form method="post">
  <p><input name="username" placeholder="usuário" autocomplete="off"></p>
  <p><input type="password" name="password" placeholder="senha"></p>

{% endblock %}
