{% extends "base.html" %}
{% block nav %}
<nav>
  <span class="tag {{ mode }}">{{ 'VULNERÁVEL' if vulnerable else 'CORRIGIDO' }}</span>
  <a href="/{{ mode }}/">Início</a>
  <a href="/{{ mode }}/login">Login</a>
  <a href="/{{ mode }}/search">Busca</a>
  <a href="/{{ mode }}/guestbook">Mural</a>
  <a href="/{{ mode }}/files">Arquivos</a>
  <a href="/{{ 'fixed' if vulnerable else 'vuln' }}/">→ ver versão {{ 'corrigida' if vulnerable else 'vulnerável' }}</a>
  <span style="margin-left:auto">
  {% if user %}
    {{ user.username }}
    <form method="post" action="/{{ mode }}/logout" style="display:inline"><button>sair</button></form>
  {% endif %}
  </span>
</nav>
{% endblock %}
