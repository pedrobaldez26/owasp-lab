<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OWASP Lab{% endblock %}</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; background: #f6f6f4; color: #1e2022; }
    nav { padding: .7rem 1rem; background: #fff; border-bottom: 1px solid #ddd; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    nav .tag { padding: .1rem .5rem; border-radius: 4px; font-size: .78rem; font-weight: 600; }
    .tag.vuln { background: #fde2e0; color: #a1261c; } .tag.fixed { background: #dcf3e3; color: #17652f; }
    main { max-width: 760px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    input, button, textarea { font: inherit; padding: .4rem .6rem; border: 1px solid #ccc; border-radius: 6px; }
    button { background: #333; color: #fff; border-color: #333; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; background: #fff; } td, th { border: 1px solid #ddd; padding: .4rem .6rem; text-align: left; }
    .err { color: #a1261c; font-family: monospace; white-space: pre-wrap; word-break: break-all; }
    .box { background: #fff; border: 1px solid #ddd; padding: .6rem .9rem; border-radius: 6px; margin: .6rem 0; }
    code { background: #eee; padding: .1rem .3rem; border-radius: 3px; }
  </style>
</head>
<body>
{% block nav %}{% endblock %}
<main>{% block content %}{% endblock %}</main>
</body>
</html>
